# Respaldo MANUAL del envío de consentimientos (/api/cron/consents). El
# envío automático lo hace pg_cron cada minuto (consents-cron.sql): una cita
# de las 10:00 recibe el consentimiento a las 10:05. Se autentica con el
# token OIDC de GitHub (sin secretos): la app verifica firma, repo y rama.
name: Consentimientos por WhatsApp
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar al endpoint
        run: |
          TOKEN=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crisbotattoo-consents" | jq -r .value)
          curl -fsS -X POST https://www.crisbotattoo.com/api/cron/consents \
            -H "Authorization: Bearer $TOKEN"
