<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161616" />
    <title>Sin conexión — OFINK</title>
    <style>
      /* Autocontenida: sin fuentes ni JS externos para que funcione 100% offline. */
      :root {
        --carbon: #161616;
        --card: #1e1e1e;
        --border: #2a2a2a;
        --fg: #f4f2f0;
        --muted: #9a9794;
        --red: #db2b39;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--carbon);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 20px; }
      .mark { width: 64px; height: 64px; }
      .wordmark { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; font-style: italic; }
      .wordmark b { color: var(--red); font-weight: 700; }
      h1 {
        margin: 0;
        font-size: 22px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 700;
      }
      p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
      button {
        margin-top: 4px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: var(--red);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }
      button:hover { opacity: 0.85; }
      button:focus-visible { outline: 2px solid #e63946; outline-offset: 2px; }
      .icon-circle {
        width: 64px; height: 64px; border-radius: 9999px;
        border: 1px solid var(--border); background: var(--card);
        display: flex; align-items: center; justify-content: center; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <!-- Gota de tinta de marca (carbón + rojo) -->
      <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#161616" />
        <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2a2a2a" stroke-width="4" />
        <path fill="#db2b39" d="M256 118 C 363 256 377 286 377 335 a121 121 0 1 1 -242 0 C 135 286 149 256 256 118 Z" />
      </svg>

      <div class="icon-circle" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="m2 2 20 20" /><path d="M8.5 16.5a5 5 0 0 1 7 0" /><path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" /><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 13a10 10 0 0 1 5.24-2.76" /><line x1="12" x2="12.01" y1="20" y2="20" />
        </svg>
      </div>

      <h1>Sin conexión</h1>
      <p>No pudimos cargar esta vista. Revisá tu conexión a internet y volvé a intentarlo; tus datos te esperan.</p>

      <button type="button" onclick="location.reload()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" />
        </svg>
        Reintentar
      </button>
    </main>
  </body>
</html>
